<!DOCTYPE html>
<html>
<head>
    <title>QWebChannel Test</title>
    <script src="qwebchannel.js"></script>
</head>
<body>
    <h1>QWebChannel Test</h1>
    <button onclick="testConnection()">Test Connection</button>
    <div id="status">Status: Not tested</div>
    
    <script>
        function testConnection() {
            document.getElementById('status').textContent = "Status: Testing...";
            
            if (typeof qt === 'undefined') {
                document.getElementById('status').textContent = "Status: qt is undefined";
                return;
            }
            
            new QWebChannel(qt.webChannelTransport, function(channel) {
                var alarmAPI = channel.objects.alarmAPI;
                
                if (alarmAPI) {
                    document.getElementById('status').textContent = "Status: alarmAPI found!";
                    console.log("alarmAPI found:", alarmAPI);
                    
                    // Test a simple method
                    if (typeof alarmAPI.getAlarms === 'function') {
                        var result = alarmAPI.getAlarms();
                        document.getElementById('status').textContent = "Status: getAlarms works!";
                        console.log("getAlarms result:", result);
                    } else {
                        document.getElementById('status').textContent = "Status: getAlarms is not a function";
                    }
                } else {
                    document.getElementById('status').textContent = "Status: alarmAPI not found in channel";
                }
            });
        }
    </script>
</body>
</html>
